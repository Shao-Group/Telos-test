[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "telos-repro"
version = "0.1.0"
description = "Paper reproduction add-on for Telos (experiments, benchmark, plot, parity)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
telos-repro = "telos_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["telos_repro*", "experiments*"]

[tool.setuptools.package-data]
telos_repro = ["py.typed"]
