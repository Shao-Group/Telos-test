# Example Tier-1 smoke cell (sr, gencode→gencode, one test assembler).
# Paths are relative to the repo root after you build bundles (docs/DATA.md)
# and have shared-train models (e.g. from `telos-repro run cross_annotation_repro`).
#
#   export TELOS_REPRO_BACKEND=telos
#   export TELOS_BUNDLES_ROOT=$PWD/data/bundles
#   PYTHONPATH=src:../Telos/src \
#     python -m telos_repro.pipeline_cli benchmark \
#       --config configs/parity_tier1.example.yaml \
#       --outdir runs/parity_tier1
#
# Or: bash scripts/parity/run_parity_tier1_tmux.sh
# (set TELOS_SRC / TELOS_BUNDLES_ROOT / GFFCOMPARE, or configs/paths.yaml)

train:
  mode: skip
  model_dir: runs/cross_annotation_repro/_cross_annotation_shared_train/sr__train_gencode/models

tests:
  - id: SRR307911__stringtie
    assembler_id: stringtie
    bam: data/bundles/GRCh38_gencode49/sr/SRR307911/align/aln.sorted.bam
    gtf: data/bundles/GRCh38_gencode49/sr/SRR307911/stringtie.gtf
    ref_gtf: genome/gencode/gencode.v49.primary_assembly.basic.annotation.gtf
    tmap: data/bundles/GRCh38_gencode49/sr/SRR307911/stringtie.stringtie.gtf.tmap
    config: configs/stage1.defaults.yaml

execution:
  stop_on_error: true

analysis:
  enabled: true
  benchmark_mode: minimal
  debug:
    keep_pr_work: false
  pr_vs_baseline:
    enabled: true
    measure: cov
    save_pr_tables: false
    plot: false
